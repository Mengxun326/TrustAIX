services:
  trustaix:
    build: .
    ports:
      - "8010:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the container.}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      TRUSTAIX_POLICY_PATH: /app/config/policy.yaml
      TRUSTAIX_AUDIT_DB: /data/trustaix.db
    volumes:
      - ./config/policy.yaml:/app/config/policy.yaml:ro
      - trustaix_data:/data

volumes:
  trustaix_data:
